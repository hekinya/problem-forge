name: Check tooling

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run tooling tests
        run: |
          python -m py_compile tools/forge.py
          python -m unittest discover -s tests -v
